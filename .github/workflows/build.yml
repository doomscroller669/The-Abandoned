name: Build Android and Windows apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk TheAbandoned.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: The Abandoned, build ${{ github.run_number }}
          files: TheAbandoned.apk
          make_latest: true

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy the game into the desktop wrapper
        shell: bash
        run: |
          mkdir -p desktop/game
          cp app/src/main/assets/index.html app/src/main/assets/three.min.js app/src/main/assets/three.LICENSE.txt desktop/game/
          cp game/icon-512.png desktop/icon.png

      - name: Build the Windows app
        working-directory: desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never

      - name: Add it to this build's release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: desktop/dist/TheAbandoned-Windows.exe

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish the web version to GitHub Pages
        run: |
          mkdir site
          cp app/src/main/assets/index.html app/src/main/assets/three.min.js app/src/main/assets/three.LICENSE.txt site/
          cp game/icon-512.png site/icon.png
          sed -i 's#</head>#<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="The Abandoned"></head>#' site/index.html
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
